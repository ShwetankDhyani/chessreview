        <h1>Free Chess Game Review &amp; Stockfish Analysis Online</h1>
        <p>
          <strong>ChessReview</strong> is an independent, 100% free chess game review platform built for club players and enthusiasts.
          Analyze unlimited games from <strong>Chess.com</strong>, <strong>Lichess</strong>, or any <strong>PGN file</strong> with Stockfish engine evaluations,
          move classifications, accuracy scores, and evaluation graphs — with <em>no sign-up, no subscriptions, and no daily limits</em>.
        </p>

        <h2>Key Capabilities</h2>
        <ul>
          <li><strong>Unlimited Free Reviews</strong>: No 1-game-per-day lockouts or paywalls. Review every game in your tournament or blitz session.</li>
          <li><strong>No Registration Required</strong>: Start analyzing instantly without creating an account or providing an email.</li>
          <li><strong>Stockfish Engine in Browser</strong>: Fast, private multithreaded WebAssembly analysis at depths 14, 16, or 18.</li>
          <li><strong>Move Classifications</strong>: Every move tagged as Brilliant (!!), Great (!), Best, Excellent, Good, Inaccuracy (?!), Mistake (?), Blunder (??), or Missed Win.</li>
          <li><strong>CAPS2 Accuracy Calculation</strong>: Standardized expected-points accuracy scores for both White and Black.</li>
          <li><strong>Interactive Eval Graph</strong>: Visual momentum curve tracking game advantages and turning points.</li>
          <li><strong>3D Over-The-Board View</strong>: Realistic wooden Staunton pieces on a 3D board for tactile tournament preparation.</li>
          <li><strong>Head-to-Head (H2H) Scouting</strong>: Free opponent preparation to inspect recent openings, win rates, and tactical tendencies.</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <dl>
          <dt><strong>Is ChessReview really free?</strong></dt>
          <dd>Yes, all features on ChessReview are completely free with no paid tiers, no credit card, and no hidden subscriptions.</dd>
          <dt><strong>How do I review a Chess.com or Lichess game?</strong></dt>
          <dd>Simply paste the game URL (or raw PGN text) into the input box on the homepage and click Review. Stockfish analyzes every move in seconds.</dd>
          <dt><strong>How does this compare to Chess.com Game Review?</strong></dt>
          <dd>Chess.com limits free accounts to 1 review per day and charges $100+/year for Diamond memberships. ChessReview offers the same core review experience for free with no daily limits.</dd>
        </dl>
